<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <script src="http://unpkg.com/tone"></script>
  <title>Digital Keyboard</title>
  
  <style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    
    body {
        width: min(1180px,100% - 40px);
        margin: auto;
    }
    
    #piano-container {
        display: flex;
        position: relative;
        margin: auto;
        padding: 12px 12px 16px;
        box-shadow: inset 0 1px 0 rgba(255,255,255,.05),inset 0 -2px 0 rgba(0,0,0,.35), 0 34px 44px -28px rgba(42,27,10,.55);
        min-width: 840px;
        border-radius: 14px;
        background: black;
    }
    #red-stripe {
        position: absolute;
        top: 12px;
        left: 12px;
        right: 12px; 
        height: 7px;
        background: #722F29;
        
        box-shadow: inset 0 -1px 0 rgba(0, 0, 0, .4);
        z-index: 3;
        pointer-events: none; 
    }
    .key {
        cursor: pointer;
        
    }
    
    
    #key-container {
        width: 100%;

        position: relative;
      display: flex;
      height: 198px;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none
    }

    .key.white {
      position: relative;
      flex: 1;
      background: #F9F5E9;
      border: 1px solid #C9C0A9;
      border-radius: 0 0 6px 6px;
      box-shadow: inset 0 -8px 0 rgba(97, 78, 45, .10), 0 3px 0 rgba(0, 0, 0, .22);
      transition: background .12s, transform .05s, box-shadow .05s
    }

    .key.white:hover {
      background: #FCF9F0
    }

    .key.white.down {
      background: #EDDFC0;
      transform: translateY(2.5px);
      box-shadow: inset 0 6px 12px -6px rgba(80, 60, 25, .35), inset 0 -8px 0 rgba(97, 78, 45, .14), 0 1px 0 rgba(0, 0, 0, .2)
    }

    .key.black {
      position: absolute;
      top: 0;
      height: 61%;
      background: #241C13;
      z-index: 2;
      border: 1px solid #000;
      border-top: none;
      border-radius: 0 0 5px 5px;
      box-shadow: inset 0 -7px 0 rgba(255, 255, 255, .08), inset 2px 0 0 rgba(255, 255, 255, .04), 0 5px 8px rgba(0, 0, 0, .5);
      transition: background .12s, transform .05s, box-shadow .05s
    }

    .key.black:hover {
      background: #2E2418
    }

    .key.black.down {
      background: #38291A;
      transform: translateY(2.5px);
      box-shadow: inset 0 -5px 0 rgba(255, 255, 255, .06), 0 2px 4px rgba(0, 0, 0, .4)
    }

    
  </style>
</head>
<body>
    
    <div id="piano-container">
        <div id="red-stripe"></div>
        <div id="key-container"></div>
    </div>
    
  <script>
    const LOW = 0, HIGH = 16;
    const synth = new Tone.Synth({
        oscillator: {
            type: "triangle" // Triangle waves sound slightly closer to a piano than square waves
        },
        envelope: {
            attack: 0.01,  // How fast the sound reaches full volume
            decay: 0.1,    // How fast it drops to the sustain level
            sustain: 0.3,  // The volume level while the key is held down
            release: 1.5   // FADEOUT: Takes 1.5 seconds to fade to silence after release
        }
    }).toDestination();

    function playNote(note) {
        synth.triggerAttack(note);
    }

    function releaseNote() {
        synth.triggerRelease();
    }

    (function init() {
        const roundDownNumber = (num, nDec) => Math.floor(num * (10**nDec)) / 10**nDec;

        const pianoCont = document.querySelector('#key-container');
        const frag = document.createDocumentFragment();
        const blackKeyPos = new Set([1, 3, 6, 8, 10]);
        const keys = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

        const numOfWhiteKeys = (() => {
            const nWhiteKeysBetween = (() => {
                let tmp = 0;
                let i = LOW%12;
                while(true) {
                    if(!blackKeyPos.has(i)) tmp++;
                    if(i === HIGH%12) break;
                    i = (i + 1) % 12;
                }
                return tmp;
            })()
            return (Math.trunc((HIGH-LOW) / 12) * 7) + nWhiteKeysBetween;
        })()

        let wi = 0; // num of white keys until now
        const whiteKeyWidth = 100 / numOfWhiteKeys;
        const bw = whiteKeyWidth * 0.58; // black key width
        for(let i = LOW; i <= HIGH; i++) {
            const key = document.createElement('div');
            const isBlackKey = blackKeyPos.has(i % 12);
            if(!isBlackKey) {
                key.className = 'key white';
                wi++;
            }
            else {
                key.className = 'key black';
                key.style.width = `${bw}%`
                key.style.left = `${((wi * whiteKeyWidth) - bw / 2)}%`
            }

            
            key.addEventListener('mousedown', (event) => {
                if (event.button === 0) {
                    key.classList.add('down');
                    playNote(`${keys[i % 12] + (Math.trunc(i / 12) + 2)}`);
                }
            });
            key.addEventListener('mouseup', () => {
            key.classList.remove('down');
                releaseNote();
            });
            
            key.addEventListener('mouseleave', () => {
                key.classList.remove('down');
                releaseNote();
            });
            frag.appendChild(key);
        }
        
        pianoCont.appendChild(frag);

    })()
  </script>
</body>
</html>
