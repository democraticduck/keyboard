<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <script src="http://unpkg.com/tone"></script>
  <title>Digital Keyboard</title>
  
  <style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    
    body {
        width: min(1180px,100% - 40px);
        margin: auto;
    }
    
    #piano-container {
        display: flex;
        position: relative;
        margin: auto;
        padding: 12px 12px 16px;
        box-shadow: inset 0 1px 0 rgba(255,255,255,.05),inset 0 -2px 0 rgba(0,0,0,.35), 0 34px 44px -28px rgba(42,27,10,.55);
        min-width: 840px;
        border-radius: 14px;
        background: black;
    }
    #red-stripe {
        height: 7px;
        background: #722F29;
        border-radius: 4px 4px 0 0;
        box-shadow: inset 0 -1px 0 rgba(0, 0, 0, .4);
    }
    .key {
        cursor: pointer;
    }
    .white-key {
        background: white;
        border: 1px solid #C9C0A9;
        border-radius: 0 0 6px 6px;
        box-shadow: inset 0 -8px 0 rgba(97,78,45,.10),0 3px 0 rgba(0,0,0,.22);
        flex: 1;
    }
    .white-key.down {
        transform: translateY(2.5px);
        box-shadow: inset 0 6px 12px -6px rgba(80, 60, 25, .35), inset 0 -8px 0 rgba(97, 78, 45, .14), 0 1px 0 rgba(0, 0, 0, .2);
    }
    #key-container {
        height: 198px;
        display: flex;
        width: 100%;
    }
  </style>
</head>
<body>
    
    <div id="piano-container">
        <div id="red-stripe"></div>
        <div id="key-container"></div>
    </div>
    
  <script>
    const LOW = 48, HIGH = 84;

    function playNote() {
				// create a synth
				const synth = new Tone.Synth().toDestination();
				// play a note from that synth
				synth.triggerAttackRelease("C4", "8n");
			}

    (function init() {
        const pianoCont = document.querySelector('#key-container');
        const frag = document.createDocumentFragment();
        for(let i = 0; i < 10; i++) {
            const whiteKey = document.createElement('div');
            whiteKey.className = 'key white-key';
            whiteKey.addEventListener('mousedown', (event) => {
            if (event.button === 0) {
                whiteKey.classList.add('down');
                playNote();
            }
        });
        
        whiteKey.addEventListener('mouseup', () => {
            whiteKey.classList.remove('down');
        });
        
        whiteKey.addEventListener('mouseleave', () => {
            whiteKey.classList.remove('down');
        });
            frag.appendChild(whiteKey);
        }
        pianoCont.appendChild(frag);
    })()
  </script>
</body>
</html>
