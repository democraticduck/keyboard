<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <script src="https://unpkg.com/tone"></script>
  <title>Digital Keyboard</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: min(1180px, 100% - 40px);
      margin: 40px auto;
      padding: 20px;
    }

    #piano-container {
      display: flex;
      position: relative;
      margin: auto;
      padding: 12px 12px 16px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05), inset 0 -2px 0 rgba(0, 0, 0, .35), 0 34px 44px -28px rgba(42, 27, 10, .55);
      border-radius: 14px;
      background: black;
    }

    #red-stripe {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      height: 7px;
      background: #722F29;
      box-shadow: inset 0 -1px 0 rgba(0, 0, 0, .4);
      z-index: 3;
      pointer-events: none;
    }

    .key {
      cursor: pointer;
    }

    #key-container {
      width: 100%;
      position: relative;
      display: flex;
      height: 198px;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    .key.white {
      position: relative;
      flex: 1;
      background: #F9F5E9;
      border: 1px solid #C9C0A9;
      border-radius: 0 0 6px 6px;
      box-shadow: inset 0 -8px 0 rgba(97, 78, 45, .10), 0 3px 0 rgba(0, 0, 0, .22);
      transition: background .12s, transform .05s, box-shadow .05s;
    }

    .key.white:hover {
      background: #FCF9F0;
    }

    .key.white.down {
      background: #EDDFC0;
      transform: translateY(2.5px);
      box-shadow: inset 0 6px 12px -6px rgba(80, 60, 25, .35), inset 0 -8px 0 rgba(97, 78, 45, .14), 0 1px 0 rgba(0, 0, 0, .2);
    }

    .key.black {
      position: absolute;
      top: 0;
      height: 61%;
      background: #241C13;
      z-index: 2;
      border: 1px solid #000;
      border-top: none;
      border-radius: 0 0 5px 5px;
      box-shadow: inset 0 -7px 0 rgba(255, 255, 255, .08), inset 2px 0 0 rgba(255, 255, 255, .04), 0 5px 8px rgba(0, 0, 0, .5);
      transition: background .12s, transform .05s, box-shadow .05s;
    }

    .key.black:hover {
      background: #2E2418;
    }

    .key.black.down {
      background: #38291A;
      transform: translateY(2.5px);
      box-shadow: inset 0 -5px 0 rgba(255, 255, 255, .06), 0 2px 4px rgba(0, 0, 0, .4);
    }

    .glabel {
      display: block;
      font-size: 9.5px;
      letter-spacing: .26em;
      text-transform: uppercase;
      color: #8D7C61;
    }

    .console {
      display: flex;
      flex-wrap: wrap;
      align-items: stretch;
      row-gap: 12px;
      background: #241C13;
      border-radius: 14px;
      padding: 12px 8px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06), 0 18px 34px -22px rgba(40, 26, 10, .55);
    }

    .cgroup {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 9px;
      padding: 6px 22px;
      border-right: 1px solid rgba(235, 224, 200, .1);
    }

    .cgroup:last-child {
      border-right: none;
    }

    .cgroup.level {
      margin-left: auto;
    }

    .segmented {
      display: flex;
      gap: 3px;
      background: rgba(0, 0, 0, .28);
      padding: 3px;
      border-radius: 8px;
    }

    .segmented button {
      appearance: none;
      background: transparent;
      border: 0;
      color: #A08F72;
      font-family: inherit;
      font-size: 10px;
      letter-spacing: .14em;
      text-transform: uppercase;
      padding: 7px 11px;
      border-radius: 6px;
      cursor: pointer;
      transition: .15s;
      touch-action: manipulation;
    }

    .segmented button:hover {
      color: #EFE4CB;
    }

    .segmented button.on {
      background: rgba(198, 140, 62, .22);
      color: #F2D9A6;
      box-shadow: inset 0 0 0 1px rgba(217, 165, 85, .45);
    }

    input[type=range] {
      appearance: none;
      -webkit-appearance: none;
      width: 130px;
      height: 22px;
      background: transparent;
      cursor: pointer;
    }

    input[type=range]::-webkit-slider-runnable-track {
      height: 2px;
      background: rgba(235, 224, 200, .28);
      border-radius: 2px;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #D9A555;
      border: 3px solid #241C13;
      box-shadow: 0 0 0 1px rgba(217, 165, 85, .6);
      margin-top: -6px;
    }

    input[type=range]::-moz-range-track {
      height: 2px;
      background: rgba(235, 224, 200, .28);
    }

    input[type=range]::-moz-range-thumb {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #D9A555;
      border: 3px solid #241C13;
      box-shadow: 0 0 0 1px rgba(217, 165, 85, .6);
    }

    button:focus-visible,
    input:focus-visible {
      outline: 1.5px dashed rgba(192, 138, 62, .75);
      outline-offset: 2px;
    }

    @media (max-width: 960px) {
      .cgroup {
        padding: 6px 14px;
      }
      .spec {
        display: none
      }
    }

    .min-width {
      min-width: 840px;
    }

    #header-container {
      width: min(1180px, 100% - 40px);
      margin: 26px auto 0;
      padding-bottom: 18px;
      border-bottom: 1px solid rgba(60, 48, 32, .22);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px
    }
    .section {
      margin-bottom: 20px;
    }

    .spec {
      width: 100%;
      text-align: right;
      font-size: 10px;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: #7A6C56;
      line-height: 1.9
    }

  </style>
</head>

<body>
  <header id="header-container" class="section">
     <p class="spec">Digital Keyboard<br>A very good digital keyboard</p>

  </header>
  <div class="min-width">
    <div class="console section">
      <div class="cgroup">
        <span class="glabel">Voice</span>
        <div class="segmented" id="voice-select" role="group">
          <button type="button" data-voice="piano" class="on">Piano</button>
          <button type="button" data-voice="synth">Synth</button>
        </div>
      </div>

      <div class="cgroup level">
        <span class="glabel">Level</span>
        <input type="range" id="volume" name="volume" min="0" max="100" value="100" step="1"
          aria-label="Master volume" />
      </div>
    </div>
    <div id="piano-container" class="section">
      <div id="red-stripe"></div>
      <div id="key-container"></div>
    </div>
  </div>
  <script>
    const LOW = 24, HIGH = 65;

    let sustainMode = false; // false = Piano, true = Synth
    let pianoReady = false;

    const synth = new Tone.PolySynth(Tone.Synth, {
      volume: -8,
      oscillator: {
        type: "custom",
        partials: [1, 0.6, 0.35, 0.2, 0.1, 0.05, 0.02]
      },
      envelope: {
        attack: 0.005,
        decay: 0.1,
        sustain: 1.0,
        release: 0.6,
        releaseCurve: "exponential"
      }
    }).toDestination();

    const piano = new Tone.Sampler({
      volume: -6,
      urls: {
        A2: "A2.mp3",
        C3: "C3.mp3",
        "D#3": "Ds3.mp3",
        "F#3": "Fs3.mp3",
        A3: "A3.mp3",
        C4: "C4.mp3",
        "D#4": "Ds4.mp3",
        "F#4": "Fs4.mp3",
        A4: "A4.mp3",
        C5: "C5.mp3",
        "D#5": "Ds5.mp3",
        "F#5": "Fs5.mp3",
        A5: "A5.mp3",
        C6: "C6.mp3",
        "D#6": "Ds6.mp3",
        "F#6": "Fs6.mp3",
        A6: "A6.mp3",
        C7: "C7.mp3"
      },
      release: 0.5,
      baseUrl: "https://tonejs.github.io/audio/salamander/",
      onload: () => {
        pianoReady = true;
      }
    }).toDestination();


    const voiceSelect = document.getElementById('voice-select');
    voiceSelect.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-voice]');
      if (!btn) return;

      voiceSelect.querySelectorAll('button').forEach(b => b.classList.remove('on'));
      btn.classList.add('on');

      sustainMode = (btn.dataset.voice === 'synth');
      synth.releaseAll();
      piano.releaseAll();
    });


    const volumeSlider = document.getElementById('volume');
    Tone.getDestination().volume.value = Tone.gainToDb(volumeSlider.value / 100);

    volumeSlider.addEventListener('input', (e) => {
      Tone.getDestination().volume.value = Tone.gainToDb(e.target.value / 100);
    });

    function playNote(note) {
      Tone.start();
      if (sustainMode || !pianoReady) {
        synth.triggerAttack(note);
      } else {
        piano.triggerAttack(note);
      }
    }

    function releaseNote(note) {
      synth.triggerRelease(note);
      piano.triggerRelease(note);
    }

    (function init() {
      const pianoCont = document.querySelector('#key-container');
      const frag = document.createDocumentFragment();
      const blackKeyPos = new Set([1, 3, 6, 8, 10]);
      const keys = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

      const numOfWhiteKeys = (() => {
        const nWhiteKeysBetween = (() => {
          let tmp = 0;
          let i = LOW % 12;
          while (true) {
            if (!blackKeyPos.has(i)) tmp++;
            if (i === HIGH % 12) break;
            i = (i + 1) % 12;
          }
          return tmp;
        })();
        return (Math.trunc((HIGH - LOW) / 12) * 7) + nWhiteKeysBetween;
      })();

      let wi = 0;
      const whiteKeyWidth = 100 / numOfWhiteKeys;
      const bw = whiteKeyWidth * 0.58;

      for (let i = LOW; i <= HIGH; i++) {
        const key = document.createElement('div');
        const isBlackKey = blackKeyPos.has(i % 12);

        if (!isBlackKey) {
          key.className = 'key white';
          wi++;
        } else {
          key.className = 'key black';
          key.style.width = `${bw}%`;
          key.style.left = `${(wi * whiteKeyWidth) - (bw / 2)}%`;
        }

        key.dataset.note = `${keys[i % 12]}${Math.trunc(i / 12) + 1}`;
        frag.appendChild(key);
      }

      pianoCont.appendChild(frag);

      let curActiveKey = null;
      let isPointerDown = false;
      let lastX = 0, lastY = 0;

      function activateKey(key) {
        if (key === curActiveKey) return;

        if (curActiveKey) {
          curActiveKey.classList.remove('down');
          releaseNote(curActiveKey.dataset.note);
        }

        if (key && pianoCont.contains(key)) {
          curActiveKey = key;
          curActiveKey.classList.add('down');
          playNote(curActiveKey.dataset.note);
        } else {
          curActiveKey = null;
        }
      }

      function keyAtPoint(x, y) {
        const el = document.elementFromPoint(x, y);
        return el && el.closest('.key');
      }

      pianoCont.addEventListener('pointerdown', (e) => {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        e.preventDefault();
        isPointerDown = true;
        pianoCont.setPointerCapture(e.pointerId);
        lastX = e.clientX;
        lastY = e.clientY;
        activateKey(e.target.closest('.key'));
      });

      pianoCont.addEventListener('pointermove', (e) => {
        if (!isPointerDown) return;

        const dx = e.clientX - lastX;
        const dy = e.clientY - lastY;
        const steps = Math.max(1, Math.ceil(Math.hypot(dx, dy) / 6));

        for (let i = 1; i <= steps; i++) {
          const key = keyAtPoint(lastX + (dx * i) / steps, lastY + (dy * i) / steps);
          activateKey(key);
        }

        lastX = e.clientX;
        lastY = e.clientY;
      });

      function stopGlissando() {
        if (!isPointerDown) return;
        isPointerDown = false;
        activateKey(null);
      }

      pianoCont.addEventListener('pointerup', stopGlissando);
      pianoCont.addEventListener('pointercancel', stopGlissando);
    })();
  </script>
</body>

</html>
